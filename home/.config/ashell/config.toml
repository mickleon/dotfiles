enable_esc_key = true

[modules]
left = [ "Workspaces", "Updates", "MediaPlayer" ]
center = [ "WindowTitle", "Notifications" ]
right = [ "Tunnels", [ "Tray", "AudioDevices" ], [ "KeyboardLayout", "Tempo" ], [ "Privacy", "Settings" ] ]

[osd]
enabled = true
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[appearance]
blur = "always"
success_color = "#a6da95"
text_color = "#cad3f5"
workspace_colors = [ "#8aadf4", "#f5a97f","#c6a0f6" ]

[appearance.opacity]
default = 0.8
menu = 0.8

[appearance.bar]
margin = [5.0, 5.0, 0.0, 5.0]

[appearance.primary_color]
base = "#8aadf4"
text = "#24273a"

[appearance.danger_color]
base = "#ed8796"
weak = "#eed49f"

[appearance.background_color]
base = "#24273a"
weak = "#363a4f"
strong = "#494d64"

# Modules

[updates]
check_cmd = "~/.config/ashell/check-updates.sh"
update_cmd = "kitty ~/.config/ashell/update.sh"
interval = 36000

[system_info]
indicators = [ "Cpu", "Memory", "Temperature" , { "Disk" = "/", "Name" = "" }]

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.disk]
warn_threshold = 80
alert_threshold = 90

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80

[media_player]
indicator_visualizer = "Background"
menu_visualizer = true
max_text_length = 75

[window_title]
mode = "Title"
truncate_title_after_length = 75

[notifications]
grouped = true

[[CustomModule]]
name = "Tunnels"
type = "Button"
icon = "󰛴"
icons.'^up$' = "󰛶"
listen_cmd = "~/.config/ashell/net-links.sh"

[tray]
right_click = "Menu"

[keyboard_layout.labels]
"English (US)" = "en"
"Russian" = "ru"

[tempo]
clock_format = "%d %b %R"

[settings]
audio_indicator_format = "IconAndPercentage"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
remove_airplane_btn = true
hibernate_cmd = "systemctl hibernate"
bluetooth_more_cmd = "blueman-manager"
wifi_more_cmd = "nm-connection-editor"
remove_idle_btn = true
vpn_more_cmd = "nm-connection-editor"
peripheral_indicators = "All"
indicators = ["PowerProfile", "Audio", "Microphone", "Bluetooth", "Network", "Vpn", "PeripheralBattery", "Battery"]

[[settings.CustomButton]]
name = "Sreen recorder"
icon = " "
status_command = "pgrep -f gpu-screen-recorder"
command = "~/.config/ashell/screen-recorder-toggle.sh"

[[settings.CustomButton]]
name = "AmneziaWG"
icon = "󰌾"
status_command = "test -d /sys/class/net/awg0"
command = "~/.config/ashell/awg-quick-toggle.sh"
